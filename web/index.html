  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0F12;
      color: #E6D5B8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    .emblem {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      position: relative;
    }

    .cross-v {
      position: absolute;
      top: 0;
      left: 28px;
      width: 8px;
      height: 64px;
      background: linear-gradient(180deg, #E6C25B 0%, #C9A227 100%);
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
    }

    .cross-h {
      position: absolute;
      top: 18px;
      left: 10px;
      width: 44px;
      height: 8px;
      background: linear-gradient(90deg, #E6C25B 0%, #C9A227 100%);
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
    }

    .app-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #E6C25B;
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }

    .app-subtitle {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #8C9BAE;
      margin: 0 0 24px 0;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(201, 162, 39, 0.2);
      border-top-color: #C9A227;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
